name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: stock_analyser
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: stock_analyser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_analyser -d stock_analyser"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      STOCK_ANALYSER_TEST_DATABASE_URL: postgresql+psycopg://stock_analyser:ci-test-password@127.0.0.1:5432/stock_analyser
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked --no-sync pytest -q

      - name: Check lint and formatting
        run: |
          uv run --locked --no-sync ruff check src tests
          uv run --locked --no-sync ruff format --check src tests

      - name: Verify CLI entry point
        run: uv run --locked --no-sync stock-analyser --help
